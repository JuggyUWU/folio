
name: Build Folio APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: android-actions/setup-android@v3

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.4'

      - name: Install dependencies
        run: bun install

      - name: Build APK
        run: |
          cd apps/mobile
          chmod +x gradlew
          ./gradlew assembleDebug

      
      
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Folio-Android-APK
          path: apps/mobile/androidApp/build/outputs/apk/debug/
          
        
          
